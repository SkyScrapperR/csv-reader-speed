name: bench
on:
  push:
    branches: [bench-ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gVisor (runsc)
        run: |
          set -x
          {
            curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
            sudo apt-get update -qq && sudo apt-get install -y -qq runsc
            sudo runsc install
            sudo systemctl restart docker
            docker info 2>/dev/null | grep -iA2 runtimes || true
            docker run --rm --runtime=runsc node:22-slim node -e "console.log('runsc ok', process.version)"
            uname -r; cat /sys/fs/cgroup/cgroup.controllers || true
          } > install.log 2>&1 || true
          cat install.log
      - run: docker pull -q node:22-slim
      - run: docker run --rm -v $PWD:/r -w /r node:22-slim sh -c 'node bench/gen.mjs /r/gen 42'
      - run: bash bench/variants.sh $PWD/var
      - name: time under gVisor and runc
        run: |
          (nproc; lscpu | grep -E 'Model name'; docker run --rm node:22-slim node --version) > result.txt
          sudo bash bench/host-run.sh 1 runsc $PWD/var $PWD/gen null > /dev/null
          sudo bash bench/host-run.sh ${ROUNDS:-11} runsc $PWD/var $PWD/gen $(ls var) > runs-gvisor.txt
          sudo bash bench/host-run.sh ${ROUNDS:-11} runc $PWD/var $PWD/gen $(ls var) > runs-runc.txt
          echo "== gVisor (runsc)" >> result.txt; node bench/summarize.mjs < runs-gvisor.txt >> result.txt
          echo "== runc" >> result.txt; node bench/summarize.mjs < runs-runc.txt >> result.txt
          cat result.txt
        env:
          ROUNDS: 11
      - name: publish results
        if: always()
        run: |
          git config user.name bench-bot; git config user.email bench-bot@users.noreply.github.com
          mkdir -p /tmp/res && cp install.log /tmp/res/ 2>/dev/null; cp result.txt runs-*.txt /tmp/res/ 2>/dev/null; touch /tmp/res/result.txt
          git checkout --orphan res && git rm -rfq . && cp /tmp/res/* . && git add .
          git commit -qm "results ${GITHUB_SHA::7} shard ${{ matrix.shard }}" && git push -f origin res:bench-results-${{ matrix.shard }}
