name: bench
on:
  push:
    branches: [bench-ci]
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: nproc; lscpu | head -20; docker pull -q node:22-slim
      - run: docker run --rm -v $PWD:/r -w /r node:22-slim sh -c 'node --version && node bench/gen.mjs /r/gen 42'
      - run: bash bench/variants.sh $PWD/var
      - name: run in a 1-CPU node:22 container
        run: |
          docker run --rm --cpus 1 --memory 1024m -v $PWD/var:/v:ro -v $PWD/gen:/in:ro -v $PWD/bench:/b:ro node:22-slim \
            bash -c 'mkdir -p /tmp/out && bash /b/cgroup-run.sh ${ROUNDS:-15} $(ls /v)' | tee runs.txt
          node bench/summarize.mjs < runs.txt
        env:
          ROUNDS: 15
